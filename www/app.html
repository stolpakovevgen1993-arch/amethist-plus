<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Аметист плюс — Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #0f1117;
            --bg-surface: #171b26;
            --bg-card: rgba(23, 27, 38, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            --caramel: #ffb300;
            --caramel-glow: rgba(255, 179, 0, 0.25);
            --mint: #00e676;
            --mint-glow: rgba(0, 230, 118, 0.2);
            --strawberry: #ff3d00;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Верхній ефект підсвітки */
        .ambient-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 180px;
            background: radial-gradient(circle at 50% 0%, rgba(255,179,0,0.15) 0%, transparent 70%);
            z-index: 0; pointer-events: none;
        }

        /* Шапка додаттка */
        .app-bar {
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px;
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
        }

        .brand {
            display: flex; align-items: center; gap: 10px;
        }

        .brand-logo {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #ffb300, #ff8f00);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #0f1117; font-size: 18px; font-weight: 800;
            box-shadow: 0 6px 20px var(--caramel-glow);
        }

        .brand-text h3 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
        .brand-text span { font-size: 10px; color: var(--caramel); font-weight: 700; text-transform: uppercase; }

        .user-pill {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            padding: 6px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600; color: var(--text-muted);
        }

        /* Основний контейнер контенту */
        .container {
            position: relative; z-index: 10;
            padding: 16px; max-width: 480px; margin: 0 auto;
            padding-bottom: 100px;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        /* Картки та віджети */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hero-scanner {
            background: linear-gradient(135deg, #1c2230, #131722);
            border: 1px solid rgba(255, 179, 0, 0.3);
            text-align: center; position: relative; overflow: hidden;
        }

        .scan-btn {
            background: linear-gradient(135deg, #ffb300, #ffa000);
            color: #0f1117; border: none;
            width: 68px; height: 68px; border-radius: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 32px; cursor: pointer;
            box-shadow: 0 10px 25px var(--caramel-glow);
            margin-bottom: 12px; transition: transform 0.2s;
        }
        .scan-btn:active { transform: scale(0.92); }

        /* Заголовки та списки */
        .section-title {
            font-size: 15px; font-weight: 700; margin: 20px 0 12px 4px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .ticket-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            border-radius: 16px; padding: 14px;
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
        }

        .ticket-info h4 { margin: 0 0 4px 0; font-size: 14px; font-weight: 700; }
        .ticket-info p { margin: 0; font-size: 12px; color: var(--text-muted); }

        .badge {
            padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase;
        }
        .badge.new { background: rgba(255, 61, 0, 0.2); color: var(--strawberry); }
        .badge.work { background: var(--caramel-glow); color: var(--caramel); }
        .badge.done { background: var(--mint-glow); color: var(--mint); }

        /* Нижня навігаційна док-панель */
        .nav-dock {
            position: fixed; bottom: 12px; left: 12px; right: 12px;
            max-width: 460px; margin: 0 auto;
            background: rgba(15, 17, 23, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            display: flex; justify-content: space-around;
            padding: 8px; z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .dock-item {
            background: none; border: none;
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-muted); font-size: 10px; font-weight: 600; gap: 3px;
            cursor: pointer; padding: 6px 12px; border-radius: 16px;
            transition: all 0.2s;
        }

        .dock-item.active { color: var(--caramel); background: rgba(255, 179, 0, 0.1); }
        .dock-item .material-icons-round { font-size: 22px; }

        /* Кнопки дій */
        .btn-action {
            background: var(--caramel); color: #0f1117; border: none;
            padding: 10px 16px; border-radius: 12px; font-weight: 800; font-size: 13px;
            cursor: pointer; box-shadow: 0 4px 15px var(--caramel-glow);
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- Шапка -->
    <div class="app-bar">
        <div class="brand">
            <div class="brand-logo">А+</div>
            <div class="brand-text">
                <h3>Аметист плюс</h3>
                <span>Industrial OS</span>
            </div>
        </div>
<div class="nav-dock">
        <button class="dock-item active" onclick="switchScreen('home', this)">
            <span class="material-icons-round">dashboard</span>
            Пульт
        </button>
        <button class="dock-item" onclick="switchScreen('tickets', this)">
            <span class="material-icons-round">build</span>
            Заявки
        </button>
        <button class="dock-item" onclick="switchScreen('warehouse', this)">
            <span class="material-icons-round">inventory_2</span>
            Склад
        </button>
        <button class="dock-item" onclick="switchScreen('calendar', this)">
            <span class="material-icons-round">calendar_month</span>
            Табель
        </button>
        <button class="dock-item" onclick="switchScreen('profile', this)">
            <span class="material-icons-round">person</span>
            Профіль
        </button>
    </div>
        <div class="user-pill" id="currentUserRole">Оператор</div>
    </div>
<!-- ЕКРАН КАЛЕНДАРЯ / ТАБЕЛЯ -->
        <div id="screen-calendar" class="screen">
            <div class="section-title"><span>Табель обліку часу</span></div>
            <div class="card">
                <p style="color: var(--text-muted); font-size: 13px; margin-top: 0;">Облік робочих змін та графік працівників</p>
                <div id="calendarShiftView" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; margin-top: 15px;">
                    <!-- Дні генерично або таблицею -->
                </div>
            </div>
        </div>
    <!-- Контейнер екранів мобільного додатка -->
    <div class="container">
        
        <!-- ЕКРАН 1: ГОЛОВНИЙ / СКАНЕР -->
        <div id="screen-home" class="screen active">
            <div class="card hero-scanner">
                <button class="scan-btn" onclick="triggerScanner()">
                    <span class="material-icons-round">qr_code_scanner</span>
                </button>
                <h3 style="margin: 0 0 6px 0; font-size: 18px;">Сканувати обладнання</h3>
                <p style="margin: 0; font-size: 12px; color: var(--text-muted);">Миттєвий виклик слюсаря або електрика з цеху</p>
            </div>

            <div class="section-title">
                <span>Термінові заявки</span>
                <span style="font-size: 12px; color: var(--caramel);" onclick="loadTickets()">Оновити</span>
            </div>
            
            <div id="mobileTicketsList">
                <!-- Динамічно завантажуються заявки -->
            </div>
        </div>

        <!-- ЕКРАН 2: ПУЛЬТ РЕМОНТНИКА / ЗАЯВКИ -->
        <div id="screen-tickets" class="screen">
            <div class="section-title"><span>Черга ремонтів ТОіР</span></div>
            <div id="allTicketsList"></div>
        </div>

        <!-- ЕКРАН 3: СКЛАД ЗАПЧАСТИН -->
        <div id="screen-warehouse" class="screen">
            <div class="section-title"><span>Склад запчастин Аметист</span></div>
            <div id="warehouseList"></div>
        </div>

        <!-- ЕКРАН 4: ПРОФІЛЬ / КАБІНЕТ -->
        <div id="screen-profile" class="screen">
            <div class="card" style="text-align: center;">
                <div style="width: 70px; height: 70px; background: var(--caramel-glow); color: var(--caramel); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; margin-bottom: 12px;" id="profileAvatar">А+</div>
                <h3 id="profileName" style="margin: 0 0 4px 0;">Користувач</h3>
                <p id="profileRoleDesc" style="color: var(--text-muted); font-size: 13px; margin: 0 0 20px 0;">Система управління цехом</p>
                <button class="btn-action" style="background: rgba(255,61,0,0.2); color: var(--strawberry); width: 100%;" onclick="logout()">Вийти з аккаунта</button>
            </div>
        </div>

    </div>

    <!-- Нижня плаваюча нативна док-панель додатка -->
    <div class="nav-dock">
        <button class="dock-item active" onclick="switchScreen('home', this)">
            <span class="material-icons-round">dashboard</span>
            Пульт
        </button>
        <button class="dock-item" onclick="switchScreen('tickets', this)">
            <span class="material-icons-round">build</span>
            Заявки
        </button>
        <button class="dock-item" onclick="switchScreen('warehouse', this)">
            <span class="material-icons-round">inventory_2</span>
            Склад
        </button>
        <button class="dock-item" onclick="switchScreen('profile', this)">
            <span class="material-icons-round">person</span>
            Профіль
        </button>
    </div>

    <script>
        // Перемикання екранів усередині єдиного додатка
        function switchScreen(screenId, btnElement) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.dock-item').forEach(d => d.classList.remove('active'));
            
            document.getElementById(`screen-${screenId}`).classList.add('active');
            btnElement.classList.add('active');

            if(screenId === 'tickets') loadAllTickets();
            if(screenId === 'warehouse') loadWarehouse();
        }

        // Симуляція сканера QR
        function triggerScanner() {
            const eq = prompt("Сканування QR: Введіть назву верстата:", "Токарний центр CNC-1");
            const desc = prompt("Опишіть несправність:", "Сторонній шум у шпинделі");
            if (eq && desc) {
                createTicketQuick(eq, desc);
            }
        }

        async function createTicketQuick(equipment, description) {
            try {
                const res = await fetch('/tickets/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        department_name: "Основний цех",
                        equipment: equipment,
                        description: description,
                        priority: "Терміново",
                        status: "Нова",
                        specialty: "Слюсар"
                    })
                });
                if(res.ok) {
                    alert("✅ Заявку успішно створено та передано службам!");
                    loadTickets();
                }
            } catch(e) { alert("Помилка зв'язку з сервером"); }
        }

        // Завантаження заявок
        async function loadTickets() {
            try {
                const res = await fetch('/tickets/');
                const data = await res.json();
                const list = document.getElementById('mobileTicketsList');
                list.innerHTML = data.slice(-4).reverse().map(t => `
                    <div class="ticket-item">
                        <div class="ticket-info">
                            <h4>${t.equipment}</h4>
                            <p>${t.description}</p>
                        </div>
                        <span class="badge ${t.status === 'Нова' ? 'new' : (t.status === 'В роботі' ? 'work' : 'done')}">${t.status}</span>
                    </div>
                `).join('') || '<p style="text-align:center; color: var(--text-muted);">Немає активних заявок</p>';
            } catch(e) {}
        }

        async function loadAllTickets() {
            try {
                const res = await fetch('/tickets/');
                const data = await res.json();
                document.getElementById('allTicketsList').innerHTML = data.reverse().map(t => `
                    <div class="card" style="margin-bottom: 12px; padding: 14px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom: 6px;">
                            <strong>${t.equipment}</strong>
                            <span class="badge ${t.status === 'Нова' ? 'new' : 'work'}">${t.status}</span>
                        </div>
                        <p style="margin: 0 0 10px 0; font-size: 13px; color: var(--text-muted);">${t.description}</p>
                        ${t.status === 'Нова' ? `<button class="btn-action" onclick="takeToWork(${t.id})">Взяти в роботу</button>` : ''}
                    </div>
                `).join('');
            } catch(e) {}
        }

        async function takeToWork(id) {
            await fetch(`/tickets/${id}/work`, { method: 'PUT' });
            loadAllTickets();
        }

        async function loadWarehouse() {
            try {
                const res = await fetch('/warehouse/');
                const data = await res.json();
                document.getElementById('warehouseList').innerHTML = data.map(w => `
                    <div class="ticket-item">
                        <div class="ticket-info">
                            <h4>${w.name}</h4>
                            <p>Категорія: ${w.category}</p>
                        </div>
                        <div style="font-weight: 800; color: var(--caramel);">${w.quantity} ${w.unit}</div>
                    </div>
                `).join('');
            } catch(e) {}
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }

        // Ініціалізація даних сесії
        const user = JSON.parse(localStorage.getItem('currentUser') || '{"full_name":"Оператор Цеху", "role":"Оператор"}');
        document.getElementById('currentUserRole').innerText = user.role;
        document.getElementById('profileName').innerText = user.full_name;
        document.getElementById('profileRoleDesc').innerText = user.role + " • " + (user.department || "Цех Аметист");
        document.getElementById('profileAvatar').innerText = user.full_name.charAt(0);

        loadTickets();
    </script>
</body>
</html>
